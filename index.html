  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body { background: #07040a; color: #f5f0e6; font-family: 'Fredoka', system-ui, sans-serif; }
    #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #play {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 7rem; height: 7rem; border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.7);
      background: rgba(0, 0, 0, 0.45); backdrop-filter: blur(4px);
      cursor: pointer; display: grid; place-items: center;
      transition: opacity 0.6s, transform 0.2s;
    }
    #play:hover { transform: translate(-50%, -50%) scale(1.08); }
    #play svg { width: 2.6rem; height: 2.6rem; margin-left: 0.4rem; fill: #fff; }
    #play.hidden { opacity: 0; pointer-events: none; }
    #play.loading { cursor: wait; animation: breathe 1.2s ease-in-out infinite; }
    #play.loading svg { opacity: 0.3; }
    @keyframes breathe { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

    /* ---------- Bug messengers ---------- */
    /* Each bug runs one 4.6s cycle: crawl in (0-22%), hold with bubble (22-78%), leave (78-100%). */
    .bug { position: fixed; width: 52vmin; pointer-events: none; visibility: hidden; }
    .bug.go { visibility: visible; animation-duration: 4.6s; animation-fill-mode: forwards; animation-timing-function: ease-in-out; }
    .bug svg { width: 100%; height: auto; display: block; overflow: visible; filter: drop-shadow(0 6px 6px rgba(0, 0, 0, 0.35)); }

    .bubble {
      position: absolute; width: max-content; max-width: min(70vw, 480px);
      padding: 0.7em 1em; border-radius: 1.2em;
      background: #fff8e7; border: 3px solid #3b2a20;
      color: var(--ink); font-size: clamp(1.2rem, 4.4vmin, 2.3rem); font-weight: 700;
      line-height: 1.15; text-align: center;
      transform: scale(0); opacity: 0;
    }
    .bubble::after {
      content: ''; position: absolute; width: 1em; height: 1em;
      background: #fff8e7; border: 3px solid #3b2a20; border-top: 0; border-left: 0;
      transform: rotate(45deg);
    }
    .bug.go .bubble { animation: pop 4.6s cubic-bezier(.34, 1.56, .64, 1) forwards; }
    @keyframes pop {
      0%, 20% { transform: scale(0); opacity: 0; }
      27%, 72% { transform: scale(1); opacity: 1; }
      77%, 100% { transform: scale(0); opacity: 0; }
    }

    /* Ladybird trundles in along the floor from the left, then scurries off right */
    #ladybird { left: 4vw; bottom: 2vh; --ink: #c8102e; }
    #ladybird .bubble { bottom: 90%; left: 55%; }
    #ladybird .bubble::after { bottom: -0.55em; left: 1.5em; }
    #ladybird.go { animation-name: ladybird; }
    @keyframes ladybird {
      0% { transform: translateX(-75vmin); }
      22%, 78% { transform: translateX(0); }
      100% { transform: translateX(130vw); }
    }

    /* Caterpillar inches in from the right, then off to the left */
    #caterpillar { right: 4vw; bottom: 2vh; width: 68vmin; --ink: #2e7d32; }
    #caterpillar .bubble { bottom: 95%; right: 45%; }
    #caterpillar .bubble::after { bottom: -0.55em; right: 1.5em; }
    #caterpillar.go { animation-name: caterpillar; }
    @keyframes caterpillar {
      0% { transform: translateX(95vmin); }
      22%, 78% { transform: translateX(0); }
      100% { transform: translateX(-140vw); }
    }

    /* Bee loops in from the top right, hovers, then zips away */
    #bee { left: 6vw; top: 6vh; width: 44vmin; --ink: #b26a00; }
    #bee .bubble { top: 70%; left: 85%; }
    #bee .bubble::after { top: 1.2em; left: -0.55em; transform: rotate(135deg); }
    #bee.go { animation-name: bee; }
    @keyframes bee {
      0% { transform: translate(110vw, 10vh) rotate(-10deg); }
      10% { transform: translate(60vw, -4vh) rotate(-6deg); }
      22% { transform: translate(0, 0) rotate(0); }
      50% { transform: translate(0, 1.5vh) rotate(2deg); }
      78% { transform: translate(0, 0) rotate(0); }
      100% { transform: translate(-40vw, -40vh) rotate(-15deg); }
    }

    /* Spider lowers itself on a thread from above, bounces, then winches back up */
    #spider { left: 50%; top: 8vh; width: 44vmin; margin-left: -22vmin; --ink: #5b2a9e; }
    #spider::before { content: ''; position: absolute; left: 50%; bottom: 82%; width: 2px; height: 300vh; background: rgba(255, 255, 255, 0.55); }
    #spider .bubble { top: 92%; left: 50%; translate: -50% 0; }
    #spider .bubble::after { top: -0.55em; left: calc(50% - 0.5em); transform: rotate(-135deg); }
    #spider.go { animation-name: spider; }
    @keyframes spider {
      0% { transform: translateY(-140vh); }
      18% { transform: translateY(4vh); }
      24% { transform: translateY(-1vh); }
      30%, 78% { transform: translateY(0); }
      100% { transform: translateY(-140vh); }
    }

    /* Butterfly flutters in from the left, settles top right, then floats off upward */
    #butterfly { right: 5vw; top: 7vh; width: 50vmin; --ink: #d4380d; }
    #butterfly .bubble { top: 55%; right: 78%; }
    #butterfly .bubble::after { top: 1.2em; right: -0.55em; transform: rotate(-45deg); }
    #butterfly.go { animation-name: butterfly; }
    @keyframes butterfly {
      0% { transform: translate(-115vw, 12vh) rotate(8deg); }
      11% { transform: translate(-60vw, -3vh) rotate(-4deg); }
      22% { transform: translate(0, 0) rotate(0); }
      50% { transform: translate(0, 2vh) rotate(-2deg); }
      78% { transform: translate(0, 0) rotate(0); }
      100% { transform: translate(25vw, -60vh) rotate(12deg); }
    }

    /* Ant marches in along the floor from the left with its phone, then hurries off right */
    #ant { left: 3vw; bottom: 1vh; width: 56vmin; --ink: #075e54; }
    #ant .bubble { bottom: 88%; left: 50%; }
    #ant .bubble::after { bottom: -0.55em; left: 1.5em; }
    #ant.go { animation-name: ant; }
    @keyframes ant {
      0% { transform: translateX(-80vmin); }
      22%, 78% { transform: translateX(0); }
      100% { transform: translateX(130vw); }
    }

    /* Firefly drifts up from the bottom right, glows, then floats away into the night */
    #firefly { right: 6vw; top: 28vh; width: 42vmin; --ink: #c2185b; }
    #firefly .bubble { top: 25%; right: 88%; }
    #firefly .bubble::after { top: 1.2em; right: -0.55em; transform: rotate(-45deg); }
    #firefly.go { animation-name: firefly; }
    @keyframes firefly {
      0% { transform: translate(50vw, 75vh) rotate(-6deg); }
      12% { transform: translate(15vw, 20vh) rotate(4deg); }
      22% { transform: translate(0, 0) rotate(0); }
      50% { transform: translate(-1vw, -2vh) rotate(-3deg); }
      78% { transform: translate(0, 0) rotate(0); }
      100% { transform: translate(20vw, -80vh) rotate(6deg); }
    }
    .bug .glow { animation: glow 0.9s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
    @keyframes glow { from { opacity: 0.55; transform: scale(0.92); } to { opacity: 1; transform: scale(1.12); } }
    .bug .wingL, .bug .wingR { transform-box: fill-box; animation: flutter 0.5s ease-in-out infinite alternate; }
    .bug .wingL { transform-origin: right center; }
    .bug .wingR { transform-origin: left center; }
    @keyframes flutter { from { transform: scaleX(1); } to { transform: scaleX(0.55); } }

    /* Little bits of life: legs scuttle, wings flap, segments ripple, everything waddles */
    .bug .legs .l { transform-box: fill-box; transform-origin: top; animation: scuttle 0.22s ease-in-out infinite alternate; }
    .bug .legs .l:nth-child(even) { animation-direction: alternate-reverse; }
    @keyframes scuttle { from { transform: rotate(-16deg); } to { transform: rotate(16deg); } }
    .bug .waddle { transform-box: fill-box; transform-origin: bottom center; animation: waddle 0.36s ease-in-out infinite alternate; }
    @keyframes waddle { from { transform: rotate(-3deg) translateY(0); } to { transform: rotate(3deg) translateY(-3px); } }
    .bug .seg { animation: ripple 0.6s ease-in-out infinite alternate; }
    .bug .seg:nth-child(2) { animation-delay: -0.15s; }
    .bug .seg:nth-child(3) { animation-delay: -0.3s; }
    .bug .seg:nth-child(4) { animation-delay: -0.45s; }
    @keyframes ripple { from { transform: translateY(0); } to { transform: translateY(-14px); } }
    .bug .wing { transform-box: fill-box; transform-origin: bottom center; animation: flap 0.09s ease-in-out infinite alternate; }
    .bug .wing.r { animation-delay: -0.045s; }
    @keyframes flap { from { transform: scaleY(1) rotate(-8deg); } to { transform: scaleY(0.55) rotate(8deg); } }
    .bug .blink { animation: blink 3.5s infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
  </style>

        <circle cx="210" cy="92" r="38" fill="#8b5a3c" />

        <circle cx="190" cy="106" r="6" fill="#ff8fa3" opacity="0.8" /><circle cx="238" cy="110" r="6" fill="#ff8fa3" opacity="0.8" />
        <path d="M202 110 Q216 122 230 110" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" />

        <rect x="160" y="128" width="30" height="46" rx="6" fill="#25d366" stroke="#0b3d2e" stroke-width="3" transform="rotate(-12 175 151)" />
        <circle cx="175" cy="150" r="9" fill="#fff" transform="rotate(-12 175 151)" /><path d="M170 158 L166 164 L174 160 Z" fill="#fff" transform="rotate(-12 175 151)" />
      </g>
    </svg>
  </div>

  <!-- Firefly with a glowing heart on its chest -->
  <div class="bug" id="firefly">
    <div class="bubble">Excited to see you all in the hive!</div>
    <svg viewBox="0 0 220 230">
      <defs><radialGradient id="heartGlow"><stop offset="0" stop-color="#fff3a0" stop-opacity="0.95" /><stop offset="0.5" stop-color="#ff6fb0" stop-opacity="0.5" /><stop offset="1" stop-color="#ff6fb0" stop-opacity="0" /></radialGradient></defs>
      <g class="glow"><circle cx="110" cy="122" r="46" fill="url(#heartGlow)" /></g>
      <g class="waddle">
        <ellipse class="wing" cx="84" cy="70" rx="22" ry="44" fill="#d6fff7" opacity="0.75" stroke="#1f4f4a" stroke-width="3" />
        <ellipse class="wing r" cx="136" cy="70" rx="22" ry="44" fill="#d6fff7" opacity="0.75" stroke="#1f4f4a" stroke-width="3" />
        <ellipse cx="110" cy="118" rx="34" ry="46" fill="#2f6f66" />
        <path d="M110 205 C90 190 78 178 84 164 C89 152 104 152 110 164 C116 152 131 152 136 164 C142 178 130 190 110 205 Z" fill="#ff6fb0" stroke="#c2185b" stroke-width="3" transform="translate(0 -60)" />
        <g class="legs" stroke="#1f4f4a" stroke-width="5" stroke-linecap="round" fill="none">
          <path class="l" d="M86 150 L74 166" /><path class="l" d="M134 150 L146 166" />
        </g>
        <path d="M92 44 Q80 14 60 12" stroke="#1f4f4a" stroke-width="5" fill="none" stroke-linecap="round" /><circle cx="58" cy="12" r="6" fill="#1f4f4a" />
        <path d="M128 44 Q140 14 160 12" stroke="#1f4f4a" stroke-width="5" fill="none" stroke-linecap="round" /><circle cx="162" cy="12" r="6" fill="#1f4f4a" />
        <circle cx="110" cy="62" r="34" fill="#1f4f4a" />
        <circle cx="97" cy="58" r="13" fill="#fff" /><circle cx="123" cy="58" r="13" fill="#fff" />
        <g class="blink"><circle cx="98" cy="60" r="6.5" fill="#1a1010" /><circle cx="124" cy="60" r="6.5" fill="#1a1010" /><circle cx="100" cy="57" r="2.4" fill="#fff" /><circle cx="126" cy="57" r="2.4" fill="#fff" /></g>
        <circle cx="86" cy="76" r="6" fill="#ff8fa3" opacity="0.8" /><circle cx="134" cy="76" r="6" fill="#ff8fa3" opacity="0.8" />
        <path d="M98 78 Q110 90 122 78" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" />
      </g>
    </svg>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { SparkRenderer, SplatMesh } from '@sparkjsdev/spark';

    // ---------- Renderer / camera ----------
    const canvas = document.getElementById('scene');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x07040a);
    scene.add(new SparkRenderer({ renderer }));
    const camera = new THREE.PerspectiveCamera(40, 1, 0.01, 100);
    camera.position.set(0, 0, 3.2);

    // ---------- Backdrop lit by the colour-changing spotlight ----------
    const wall = new THREE.Mesh(
      new THREE.PlaneGeometry(30, 30),
      new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.95 })
    );
    wall.position.z = -3;
    wall.renderOrder = -1; // draw first so it never covers the splats
    scene.add(wall);

    scene.add(new THREE.AmbientLight(0xffffff, 0.12));

    // A single fixed spotlight washing the wall. Its colour jumps through a set of
    // bold colours while the music plays. (Splats aren't lit by it and cast no shadow.)
    const spot = new THREE.SpotLight(0xff2d95, 26, 20, Math.PI / 5, 0.8, 1.5);
    spot.position.set(-1.8, 1.2, 3);
    spot.target.position.set(0, 0, -3);
    scene.add(spot, spot.target);

    // The light show. Colours match the fridge-magnet letters in the scan (plus cyan).
    // Each entry is [colour, strength, seconds].
    const FALLBACK = [0xff2020, 34, 1];
    const LIGHT_SHOW = [
      [0xff2020, 34, 1], [0x2a7dff, 34, 1], [0x33ff33, 34, 1], [0xffee00, 34, 1],
      [0xff1fc8, 34, 1], [0xff8000, 34, 1], [0xb040ff, 34, 1], [0x00f0ff, 34, 1],
      [0xff2020, 34, 1.5], [0xffee00, 34, 1.5], [0x2a7dff, 34, 1.5], [0xff1fc8, 34, 1.5],
      [0x33ff33, 34, 1], [0xb040ff, 34, 1], [0xff8000, 34, 1], [0x00f0ff, 34, 1],
      [0xff2020, 34, 0.5], [0x2a7dff, 34, 0.5], [0xffee00, 34, 0.5], [0xff1fc8, 34, 0.5],  // quick burst
      [0x33ff33, 34, 0.5], [0xff8000, 34, 0.5], [0xb040ff, 34, 0.5], [0x00f0ff, 34, 0.5],
      [0xff1fc8, 34, 1.5], [0x33ff33, 34, 1.5], [0xff8000, 34, 1.5], [0x2a7dff, 34, 1.5],
      [0xb040ff, 34, 1], [0xffee00, 34, 1], [0xff2020, 34, 1], [0x00f0ff, 34, 1],
    ];
    const SHOW_LENGTH = LIGHT_SHOW.reduce((sum, [, , secs]) => sum + secs, 0);
    function lightAt(time) {
      let cursor = time % SHOW_LENGTH;
      for (const step of LIGHT_SHOW) { if (cursor < step[2]) return step; cursor -= step[2]; }
      return FALLBACK;
    }

    const music = document.getElementById('music');
    const playBtn = document.getElementById('play');

    // ---------- Model ----------
    const spinner = new THREE.Group();
    scene.add(spinner);

    // Gaussian splat scan. Its lighting is baked in from the capture.
    const cube = new SplatMesh({ url: '/cube.compressed.ply' });
    const white = new THREE.Color(0xffffff);
    cube.initialized.then(() => {
      // Centre the scan and scale it to roughly 1.4 units across
      const box = cube.getBoundingBox(true);
      const size = box.getSize(new THREE.Vector3());
      cube.position.sub(box.getCenter(new THREE.Vector3()));
      spinner.scale.setScalar(1.4 / Math.max(size.x, size.y, size.z));
      // Splat files come in upside down, so flip it the right way up
      const upright = new THREE.Group();
      upright.rotation.x = Math.PI;
      upright.add(cube);
      spinner.add(upright);
      playBtn.disabled = false;
      playBtn.classList.remove('loading');
    }).catch((err) => console.error(err));

    function resize() {
      const w = window.innerWidth, h = window.innerHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      // Close in so the letters and bugs fill the view; pull back a little on narrow screens
      camera.position.z = w < h ? 1.6 : 1.0;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    resize();

    // ---------- Animation (only moves once Play is pressed) ----------
    let playing = false, t = 0;
    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      const dt = clock.getDelta();
      if (playing) t += dt;
      spinner.rotation.y = -t * 0.8;
      spinner.rotation.x = Math.sin(t * 0.5) * 0.15;
      spinner.position.y = Math.sin(t * 1.2) * 0.05;
      // Snap to the current step of the light show (no fading between colours)
      const [colour, strength] = lightAt(t);
      spot.color.set(colour);
      spot.intensity = strength;
      // Tint the scan a little toward the light colour so it feels part of the show
      cube.recolor.copy(white).lerp(spot.color, playing ? 0.35 : 0);
      renderer.render(scene, camera);
    });

    // ---------- Bug messengers ----------
    // Each bug's entrance, bubble and exit are CSS animations; JS just cues them in order.
    const bugs = [...document.querySelectorAll('.bug')];
    const FIRST_DELAY = 6000, EACH = 5000, REST = 10000;

    for (const bug of bugs) bug.addEventListener('animationend', (e) => {
      if (e.target === bug) bug.classList.remove('go');
    });

    function cue(bug) {
      bug.classList.remove('go');
      void bug.offsetWidth; // restart the animation if it's mid-run
      bug.classList.add('go');
    }

    function runBugs() {
      bugs.forEach((bug, i) => setTimeout(() => cue(bug), i * EACH));
      setTimeout(runBugs, bugs.length * EACH + REST);
    }

    // ---------- Play ----------
    playBtn.addEventListener('click', () => {
      // Start the song 86s in (the #t=86 on the src covers browsers that ignore this)
      if (music.currentTime < 86) music.currentTime = 86;
      music.play();
      setTimeout(runBugs, FIRST_DELAY);
      playing = true;
      playBtn.classList.add('hidden');
    });
  </script>
