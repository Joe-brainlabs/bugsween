<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bugsween</title>
  <meta name="description" content="Bugsween. The ugliest bug ball of the year." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body { background: #07040a; color: #f5f0e6; font-family: system-ui, -apple-system, sans-serif; }
    #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #play {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 7rem; height: 7rem; border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.7);
      background: rgba(0, 0, 0, 0.45); backdrop-filter: blur(4px);
      cursor: pointer; display: grid; place-items: center;
      transition: opacity 0.6s, transform 0.2s;
    }
    #play:hover { transform: translate(-50%, -50%) scale(1.08); }
    #play svg { width: 2.6rem; height: 2.6rem; margin-left: 0.4rem; fill: #fff; }
    #play.hidden { opacity: 0; pointer-events: none; }
    /* ---------- Pop-art captions ---------- */
    #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
    #flash.on { animation: flash 0.35s ease-out; }
    #caption {
      position: fixed; top: 50%; left: 50%;
      width: min(92vw, 760px); aspect-ratio: 1.5;
      transform: translate(-50%, -50%);
      display: grid; place-items: center;
      pointer-events: none; opacity: 0;
    }
    #caption.on { animation: slam 2s cubic-bezier(.2, 1.4, .4, 1) forwards; }
    #caption::before, #caption::after { content: ''; position: absolute; inset: 0; clip-path: var(--burst); }
    #caption::before { background: #000; transform: scale(1.07); }
    #caption::after {
      background-color: var(--bg);
      background-image: radial-gradient(circle, rgba(0, 0, 0, 0.22) 24%, transparent 26%);
      background-size: 11px 11px;
    }
    #caption span {
      position: relative; z-index: 1;
      padding: 0 20%; text-align: center; line-height: 0.95;
      font-family: 'Bangers', 'Impact', sans-serif;
      font-size: clamp(2.2rem, 8.5vw, 5.2rem); letter-spacing: 0.03em;
      color: var(--fg);
      -webkit-text-stroke: 3px #000; paint-order: stroke fill;
      text-shadow: 5px 5px 0 #000;
      transform: rotate(-5deg);
    }
    body.shake #scene { animation: shake 0.4s; }
    @keyframes flash { 0% { opacity: 0.95; } 100% { opacity: 0; } }
    @keyframes slam {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(3) rotate(-25deg); }
      10%  { opacity: 1; transform: translate(-50%, -50%) scale(0.85) rotate(6deg); }
      16%  { transform: translate(-50%, -50%) scale(1.12) rotate(-4deg); }
      22%  { transform: translate(-50%, -50%) scale(1) rotate(-2deg); }
      88%  { opacity: 1; transform: translate(-50%, -50%) scale(1.04) rotate(-2deg); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(0) rotate(20deg); }
    }
    @keyframes shake {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-14px, 8px); }
      40% { transform: translate(12px, -10px); }
      60% { transform: translate(-8px, -6px); }
      80% { transform: translate(6px, 8px); }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <button id="play" aria-label="Play">
    <svg viewBox="0 0 24 24"><path d="M6 4l15 8-15 8z" /></svg>
  </button>
  <div id="flash"></div>
  <div id="caption"><span></span></div>
  <audio id="music" src="/bugsball.mp3#t=85" loop preload="auto"></audio>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // ---------- Renderer / camera ----------
    const canvas = document.getElementById('scene');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x07040a);
    const camera = new THREE.PerspectiveCamera(40, 1, 0.01, 100);
    camera.position.set(0, 0, 3.2);

    // ---------- Backdrop that catches the coloured shadows ----------
    const wall = new THREE.Mesh(
      new THREE.PlaneGeometry(30, 30),
      new THREE.MeshStandardMaterial({ color: 0x9a9a9a, roughness: 0.95 })
    );
    wall.position.z = -1.4;
    wall.receiveShadow = true;
    scene.add(wall);

    scene.add(new THREE.AmbientLight(0xffffff, 0.04));

    // A single fixed spotlight, off to one side so its shadow lands beside the shape.
    // Its colour cycles through the rainbow while the music plays.
    const spot = new THREE.SpotLight(0xff2d95, 14, 20, Math.PI / 5, 0.8, 1.5);
    spot.position.set(-1.8, 1.2, 3);
    spot.target.position.set(0, 0, -1.4);
    spot.castShadow = true;
    spot.shadow.mapSize.set(2048, 2048);
    spot.shadow.bias = -0.0005;
    spot.shadow.radius = 3;
    scene.add(spot, spot.target);

    // ---------- Model ----------
    const spinner = new THREE.Group();
    scene.add(spinner);

    new GLTFLoader().load('/ghost.glb', (gltf) => {
      const model = gltf.scene;
      model.traverse((o) => { if (o.isMesh) o.castShadow = true; });
      // Centre the scan and scale it to roughly 1.4 units across
      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      model.position.sub(box.getCenter(new THREE.Vector3()));
      spinner.scale.setScalar(1.4 / Math.max(size.x, size.y, size.z));
      spinner.add(model);
    }, undefined, (err) => console.error(err));

    function resize() {
      const w = window.innerWidth, h = window.innerHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      // Pull the camera back on narrow screens so the cube fits
      camera.position.z = w < h ? 2.7 : 1.8;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    resize();

    // ---------- Animation (only moves once Play is pressed) ----------
    let playing = false, t = 0;
    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      const dt = clock.getDelta();
      if (playing) t += dt;
      spinner.rotation.y = t * 0.8;
      spinner.rotation.x = Math.sin(t * 0.5) * 0.15;
      spinner.position.y = Math.sin(t * 1.2) * 0.05;
      // Hue starts on pink and takes ~8s to go all the way round
      spot.color.setHSL((0.92 + t / 8) % 1, 1, 0.55);
      renderer.render(scene, camera);
    });

    // ---------- Play ----------
    const music = document.getElementById('music');
    const playBtn = document.getElementById('play');

    // ---------- Captions ----------
    const CAPTIONS = [
      { text: 'You are invited to a Bugsween!', bg: '#ffe500', fg: '#e4202e' },
      { text: '28th of November', bg: '#e4202e', fg: '#ffe500' },
      { text: '19 Roden Street', bg: '#1c75bc', fg: '#fff' },
      { text: 'The theme is bugs!', bg: '#ffe500', fg: '#1c75bc' },
    ];
    const FIRST_DELAY = 5000, EACH = 5000, REST = 10000;
    const caption = document.getElementById('caption');
    const captionText = caption.querySelector('span');
    const flash = document.getElementById('flash');

    // Jagged comic starburst, slightly different every time
    function burst() {
      const n = 22, pts = [];
      for (let i = 0; i < n * 2; i++) {
        const a = (i / (n * 2)) * Math.PI * 2;
        const r = i % 2 ? 36 + Math.random() * 6 : 48 + Math.random() * 4;
        pts.push(`${50 + Math.cos(a) * r}% ${50 + Math.sin(a) * r}%`);
      }
      return `polygon(${pts.join(',')})`;
    }

    function show({ text, bg, fg }) {
      captionText.textContent = text;
      caption.style.setProperty('--burst', burst());
      caption.style.setProperty('--bg', bg);
      caption.style.setProperty('--fg', fg);
      // Restart the CSS animations
      for (const el of [caption, flash, document.body]) {
        el.classList.remove('on', 'shake');
        void el.offsetWidth;
      }
      caption.classList.add('on');
      flash.classList.add('on');
      document.body.classList.add('shake');
    }

    function runCaptions() {
      CAPTIONS.forEach((c, i) => setTimeout(() => show(c), i * EACH));
      setTimeout(runCaptions, CAPTIONS.length * EACH + REST);
    }

    playBtn.addEventListener('click', () => {
      // Start the song 1 minute in (the #t=60 on the src covers browsers that ignore this)
      if (music.currentTime < 60) music.currentTime = 60;
      music.play();
      setTimeout(runCaptions, FIRST_DELAY);
      playing = true;
      playBtn.classList.add('hidden');
    });

  </script>
</body>
</html>
